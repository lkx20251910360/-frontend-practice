<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图书馆信息中心</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #fff; color: #000; }
    nav { background: #0d47a1; }
    nav a { color: #fff; text-decoration: none; margin-right: 12px; }
    h2 { border-bottom: 2px solid #0d47a1; padding-bottom: 4px; }
    ul { padding-left: 20px; }
    li { padding: 4px 0; }
  </style>
</head>
<body>

  <nav class="p-3">
    <a href="#home">首页</a>
    <a href="#books">图书查询</a>
    <a href="#stats">数据图表</a>
    <a href="#view3d">三维展示</a>
  </nav>

  <div class="container my-4">
    <section id="home">
      <h2>首页</h2>
      <p>开放时间 周一至周日 8:00 - 22:00</p>
      <p>馆藏规模 纸质图书 56 万册，电子资源 120 万种</p>
      <p>楼层分布 1楼数学 2楼计算机 3楼文学 4楼历史</p>
    </section>

    <section id="books" class="mt-5">
      <h2>图书查询</h2>
      <input id="keyword" class="form-control mb-2" placeholder="搜索书名">
      <select id="category" class="form-select mb-2">
        <option value="">全部分类</option>
        <option>计算机</option>
        <option>文学</option>
        <option>历史</option>
        <option>数学</option>
      </select>
      <div id="msg" class="text-danger"></div>
      <ul id="book-list"></ul>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    let books = [];

    function render(list) {
      $('#book-list').empty();
      if (list.length === 0) {
        $('#book-list').append('<li>暂无数据</li>');
        return;
      }
      list.forEach(b => {
        $('#book-list').append(
          `<li>${b.title} ${b.category} ${b.floor}楼 可借 ${b.available} / 共 ${b.total}</li>`
        );
      });
    }

    $.getJSON('data/books.json')
      .done(data => {
        books = data;
        render(books);
      })
      .fail(() => {
        $('#book-list').append('<li>数据加载失败</li>');
      });

    $('#keyword, #category').on('input change', () => {
      const kw = $('#keyword').val().trim();
      const cat = $('#category').val();

      if (kw.length > 20) {
        $('#msg').text('搜索词不能超过20个字符');
        return;
      } else {
        $('#msg').text('');
      }

      const list = books.filter(b =>
        b.title.includes(kw) && (cat === '' || b.category === cat)
      );
      render(list);
    });
  </script>
</body>
</html>
