<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>迷你版权园信息中心</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>迷你版权园信息中心</h1>
    <nav>
      <button class="nav-btn active" data-target="home">首页</button>
      <button class="nav-btn" data-target="data">数据</button>
      <button class="nav-btn" data-target="chart">可视化</button>
      <button class="nav-btn" data-target="about">关于</button>
    </nav>
  </header>

  <main>
    <section id="home" class="panel active">
      <h2>欢迎</h2>
      <p>状态：<span id="status">加载中...</span></p>
    </section>

    <section id="data" class="panel">
      <h2>数据列表</h2>
      <button id="load-data">加载数据</button>
      <button id="clear-data">清空</button>
      <ul id="data-list"></ul>
      <p id="empty-tip">暂无数据</p>
    </section>

    <section id="chart" class="panel">
      <h2>可视化</h2>
      <canvas id="bar-chart" width="600" height="300"></canvas>
    </section>

    <section id="about" class="panel">
      <h2>关于</h2>
      <p>主题：迷你版权园信息中心</p>
    </section>
  </main>

  <script src="libs/chart.umd.js"></script>
  <script src="js/main.js" defer></script>
  <script src="js/chart.js" defer></script>
</body>
</html>
