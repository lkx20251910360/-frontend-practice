<!DOCTYPE html>
<html lang="zh-CN">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>校园社团报名</title>、
<body>
       <header>
              <h1>校园社团报名</h1>
               <p>欢迎加入校园社团，请认真填写以下报名信息。</p>
       </header>
       <nav>
               <a href="#basic">基本信息</a>
               <a href="#interest">兴趣方向</a>
               <a href="#intro">提交报名</a>
       </nav>
    <main>

    <form>

        <section id="basic">
            <h2>基本信息</h2>

            <p>
                <label for="name">姓名：</label>
                <input type="text" id="name" name="name" required>
            </p>

            <p>
                <label for="email">邮箱：</label>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="age">年龄：</label>
                <input type="number" id="age" name="age" min="16" max="30" required>
            </p>

            <p>
                <label for="date">报名日期：</label>
                <input type="date" id="date" name="date" required>
            </p>

            <p>
                <label for="phone">手机号码：</label>
                <input
                    type="text"
                    id="phone"
                    name="phone"
                    pattern="1[3-9][0-9]{9}"
                    maxlength="11"

            </p>

        </section>


        <section id="interest">
            <h2>兴趣方向</h2>

            <p>性别：</p>

            <input type="radio" id="male" name="gender" value="男" required>
            <label for="male">男</label>

            <input type="radio" id="female" name="gender" value="女">
            <label for="female">女</label>

            <p>
                <label for="intro">个人介绍：</label>
                <textarea
                    id="intro"
                    name="intro"
                    rows="5"
                    maxlength="200"
                    required
                ></textarea>
            </p>


            <p>
                <label for="photo">上传作品：</label>
                <input type="file" id="photo" name="photo" accept="image/*">
            </p>

        </section>


        <section id="submit">
            <h2>提交报名</h2>

            <p>
                <input type="checkbox" id="agree" name="agree" required>
                <label for="agree">我确认以上信息填写真实有效</label>
            </p>

            <button type="submit">提交报名</button>
            <button type="reset">重新填写</button>

        </section>

    </form>

    </main>
    <footer>
        <p>校园摄影社报名信息采集页</p>
        <p>请确保填写的信息真实有效。</p>
</footer>
</body>
</html>
