<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书收藏</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: sans-serif;
            max-width: 560px;
            margin: 24px auto;
            padding: 0 16px;
        }
        form {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        input {
            padding: 6px;
        }
        input[type="number"] {
            width: 70px;
        }
        .tip {
            color: #c00;
            font-size: 14px;
            min-height: 20px;
        }
        .search {
            margin: 12px 0;
        }
        ul {
            padding-left: 20px;
        }
        li {
            margin: 6px 0;
        }
        li.read {
            text-decoration: line-through;
            color: #999;
        }
        .del {
            margin-left: 8px;
            cursor: pointer;
            color: #c00;
        }
        .toggle {
            margin-left: 8px;
            cursor: pointer;
            color: #06c;
        }
        .empty-tip {
            color: #999;
        }
    </style>
</head>
<body>
    <h1>图书收藏</h1>

    <form id="add-form">
        <input type="text" id="title-input" placeholder="书名">
        <input type="text" id="author-input" placeholder="作者">
        <input type="number" id="rating-input" placeholder="评分" min="0" max="5">
        <button type="submit">添加</button>
    </form>

    <p class="tip" id="tip"></p>

    <div class="search">
        <input type="text" id="search-input" placeholder="搜索书名或作者">
    </div>

    <ul id="book-list"></ul>

    <script src="app.js"></script>
</body>
</html>
