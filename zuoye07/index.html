<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>主题三维场景 - 星球宇宙</title>
  <style> body { margin: 0; overflow: hidden; background: #000; } </style>
</head>
<body>
  <script src="libs/three.min.js"></script>
  <script src="libs/OrbitControls.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050510);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 4, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambientLight);

    const sunLight = new THREE.PointLight(0xffaa00, 2, 50);
    scene.add(sunLight);

    const sun = new THREE.Mesh(
      new THREE.SphereGeometry(1.2, 32, 32),
      new THREE.MeshBasicMaterial({ color: 0xffaa00 })
    );
    scene.add(sun);

    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(2.5, 0.05, 16, 100),
      new THREE.MeshBasicMaterial({ color: 0x888888 })
    );
    ring.rotation.x = Math.PI / 2;
    scene.add(ring);

    const planet = new THREE.Mesh(
      new THREE.SphereGeometry(0.5, 32, 32),
      new THREE.MeshStandardMaterial({ color: 0x4fc3f7 })
    );
    scene.add(planet);

    const moon = new THREE.Mesh(
      new THREE.BoxGeometry(0.2, 0.2, 0.2),
      new THREE.MeshStandardMaterial({ color: 0xffffff })
    );
    scene.add(moon);

    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      t += 0.01;

      planet.position.x = Math.cos(t) * 3.5;
      planet.position.z = Math.sin(t) * 3.5;
      planet.rotation.y += 0.02;

      moon.position.x = planet.position.x + Math.cos(t * 3) * 1.2;
      moon.position.z = planet.position.z + Math.sin(t * 3) * 1.2;
      moon.position.y = Math.sin(t * 3) * 0.5;

      sun.rotation.y += 0.005;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
