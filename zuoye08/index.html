<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迷你版图书馆信息中心</title>
    <link rel="stylesheet" href="libs/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">图书馆信息中心</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="#home">首页</a></li>
                    <li class="nav-item"><a class="nav-link" href="#reading">阅览室</a></li>
                    <li class="nav-item"><a class="nav-link" href="#stats">借阅统计</a></li>
                    <li class="nav-item"><a class="nav-link" href="#three">图书馆三维</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <section id="home" class="mb-5">
            <h2>欢迎来到图书馆信息中心</h2>
            <p>本页面整合了阅览室查询、借阅量统计与图书馆三维导览功能。</p>
        </section>

        <section id="reading" class="mb-5">
            <h2>阅览室查询</h2>
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <select id="areaFilter" class="form-select">
                        <option value="all">全部区域</option>
                        <option value="1">文学区</option>
                        <option value="2">科技区</option>
                        <option value="3">历史区</option>
                        <option value="4">期刊区</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="openFilter">
                        <label class="form-check-label" for="openFilter">仅显示开放</label>
                    </div>
                </div>
            </div>
            <ul id="roomList" class="list-group"></ul>
        </section>

        <section id="stats" class="mb-5">
            <h2>借阅量统计</h2>
            <div style="max-width: 600px;">
                <canvas id="usageChart"></canvas>
            </div>
        </section>

        <section id="three" class="mb-5">
            <h2>图书馆三维导览</h2>
            <p class="text-muted">鼠标拖动旋转视角，滚轮缩放</p>
            <div id="three-container" style="width: 100%; height: 400px; border: 1px solid #e5e7eb; border-radius: 8px; overflow: hidden;"></div>
        </section>
    </main>

    <script src="libs/bootstrap.bundle.min.js"></script>
    <script src="libs/chart.umd.js"></script>
    <script src="libs/three.min.js"></script>
    <script src="libs/OrbitControls.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
